[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parcer-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "procrastinate>=3.0.0",
    "psycopg[binary]>=3.1.0",
    "anthropic>=0.40.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "passlib[argon2]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0",
    "supabase>=2.5.0",
    "aiofiles>=23.0.0",
    "email-validator>=2.1.0",
    "dnspython>=2.6.0",
    "openai>=1.40.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/core/email.py" = ["E501"]
"app/models/*.py" = ["E501"]
"app/api/v1/auth.py" = ["E501"]
"app/services/letters/generator.py" = ["E501"]
"app/services/chat/tools.py" = ["E501"]
"app/services/leads/crawler.py" = ["E501"]
"app/services/leads/light_ai.py" = ["E501"]
"app/services/leads/pipeline.py" = ["E402", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
